<div class="tanque-container">
  <h2>Nivel del Estanque</h2>
  <div class="tanque">
    <!-- Agua dinámica según el estado del tanque -->
    <div class="agua" [class.agua-llena]="isTankFull" [class.agua-vacia]="!isTankFull">
      <div class="burbujas" *ngIf="isTankFull"></div>
    </div>
  </div>
  <div class="estado-tanque">
    <p *ngIf="isTankFull" class="tanque-lleno">El tanque está lleno</p>
    <p *ngIf="!isTankFull" class="tanque-vacio">El tanque está vacío</p>
  </div>
</div>
