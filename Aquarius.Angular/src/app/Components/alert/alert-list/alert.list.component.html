<div class="alert-table-container">
    <h2>Lista de Alertas</h2>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      
      <!-- Column for Message -->
      <ng-container matColumnDef="message">
        <th mat-header-cell *matHeaderCellDef> Mensaje de Alerta </th>
        <td mat-cell *matCellDef="let alert"> {{ alert.message }} </td>
      </ng-container>
  
      <!-- Column for Time -->
      <ng-container matColumnDef="timeStamp">
        <th mat-header-cell *matHeaderCellDef> Fecha </th>
        <td mat-cell *matCellDef="let alert"> {{ alert.timeStamp | date:'medium' }} </td>
      </ng-container>
  
      <!-- Table Header and Rows -->
      <tr mat-header-row *matHeaderRowDef="['message', 'timeStamp']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['message', 'timeStamp'];"></tr>
    </table>
  
    <!-- Paginator -->
    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
